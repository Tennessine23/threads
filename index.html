<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Login</title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="bg-circle left"></div>
<div class="bg-circle right"></div>

<div class="container">

    <div class="login-box">

        <h2>Log in with your social account</h2>

        <form>

            <input
            type="text"
            placeholder="Username, phone number or email address">

            <input
            type="password"
            placeholder="Password">

            <button type="submit">
                Log in
            </button>

        </form>

        <a href="#" class="forgot">
            Forgotten password?
        </a>

        <div class="divider">
            <span></span>
            <p>or</p>
            <span></span>
        </div>

        <button class="social-btn">

            <i class="fa-brands fa-instagram"></i>

            <span>Continue with Instagram</span>

            <i class="fa-solid fa-chevron-right arrow"></i>

        </button>

    </div>

    <div class="qr-section">

        <p>Scan to get the app</p>

        <div class="qr-box">

            <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://example.com"
            alt="QR">

        </div>

    </div>

</div>

<footer>

</footer>

</body>
</html>
